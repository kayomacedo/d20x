<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>D20X · Baixar APK</title>
    <meta name="description" content="Baixe a versão mais recente do D20X, o rolador de dados de mesa." />
    <link rel="icon" href="./icon.png" />
    <style>
      :root {
        --page: #020617;
        --bg: #0f172a;
        --surface: #020617;
        --card: #0b1220;
        --border: #1e293b;
        --text: #f1f5f9;
        --muted: #94a3b8;
        --faint: #64748b;
        --indigo: #a5b4fc;
        --indigo-strong: #6366f1;
        --emerald: #34d399;
      }

      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; }
      body {
        font-family: Inter, ui-sans-serif, system-ui, Segoe UI, sans-serif;
        background:
          radial-gradient(circle at top, #1e1b4b 0%, transparent 42%),
          var(--page);
        color: var(--text);
        display: grid;
        place-items: center;
        padding: 32px 16px;
      }

      .card {
        width: min(440px, 100%);
        background: color-mix(in srgb, var(--card) 88%, transparent);
        border: 1px solid var(--border);
        border-radius: 24px;
        padding: 32px 28px 28px;
        text-align: center;
        box-shadow: 0 24px 80px #00000066;
      }

      .mark {
        width: 84px;
        height: 84px;
        margin: 0 auto 16px;
        border-radius: 20px;
        background: var(--indigo-strong);
        border: 3px solid var(--indigo);
        display: grid;
        place-items: center;
        line-height: 0.85;
        font-weight: 900;
      }

      .mark small {
        display: block;
        font-size: 14px;
        letter-spacing: 1px;
      }

      .mark b {
        display: block;
        font-size: 28px;
      }

      .kicker {
        color: var(--indigo);
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 1.2px;
        text-transform: uppercase;
        margin: 0 0 6px;
      }

      h1 {
        margin: 0;
        font-size: 32px;
        font-weight: 900;
      }

      .version {
        margin: 8px 0 0;
        color: var(--faint);
        font-size: 14px;
      }

      .notes {
        margin: 16px 0 0;
        color: var(--muted);
        font-size: 15px;
        line-height: 1.5;
      }

      .download {
        display: block;
        margin-top: 22px;
        width: 100%;
        background: var(--indigo-strong);
        color: #fff;
        text-decoration: none;
        border: 0;
        border-radius: 14px;
        padding: 14px 16px;
        font-size: 16px;
        font-weight: 800;
        cursor: pointer;
      }

      .download[aria-disabled="true"] {
        opacity: 0.5;
        pointer-events: none;
      }

      .hint {
        margin: 14px 0 0;
        color: var(--faint);
        font-size: 13px;
        line-height: 1.45;
      }

      .status {
        margin-top: 12px;
        color: var(--emerald);
        font-size: 13px;
        font-weight: 700;
      }

      .error { color: #f87171; }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="mark" aria-hidden="true">
        <div>
          <small>D20</small>
          <b>X</b>
        </div>
      </div>
      <p class="kicker">Rolador de mesa</p>
      <h1>D20X</h1>
      <p class="version" id="version">Carregando versão…</p>
      <p class="notes" id="notes"></p>
      <a class="download" id="download" aria-disabled="true">Baixar APK</a>
      <p class="hint">
        No celular, permita instalar apps desta origem. Depois de baixar, abra o arquivo e instale.
      </p>
      <p class="status" id="status"></p>
    </main>
    <script>
      const versionEl = document.getElementById('version');
      const notesEl = document.getElementById('notes');
      const downloadEl = document.getElementById('download');
      const statusEl = document.getElementById('status');

      function resolveUrl(value) {
        if (!value) return '';
        try {
          return new URL(value, window.location.href).toString();
        } catch {
          return value;
        }
      }

      async function loadFeed() {
        const response = await fetch('./latest.json', { cache: 'no-store' });
        if (!response.ok) throw new Error('feed');
        const feed = await response.json();
        const apkUrl = resolveUrl(feed.apkUrl || '');

        versionEl.textContent = feed.version ? `Versão ${feed.version}` : 'Versão indisponível';
        notesEl.textContent = feed.notes || 'Nova versão do rolador de dados.';

        if (!apkUrl) {
          downloadEl.textContent = 'APK ainda sem arquivo';
          statusEl.classList.add('error');
          statusEl.textContent = 'Coloque o APK em updates/apk/d20x.apk e publique de novo.';
          return;
        }

        downloadEl.href = apkUrl;
        downloadEl.removeAttribute('aria-disabled');
        downloadEl.textContent = `Baixar D20X ${feed.version || ''}`.trim();
        statusEl.textContent = 'Pronto para instalar no Android.';
      }

      loadFeed().catch(() => {
        versionEl.textContent = 'Não deu para ler a versão';
        statusEl.classList.add('error');
        statusEl.textContent = 'O latest.json não abriu neste endereço.';
      });
    </script>
  </body>
</html>
